# website-astro-wcs / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: static-site

traits:
  - cloudflare-pages
  # Deployed via Cloudflare Pages Git integration (auto-deploy on push to main).
  # The trait removes the CI obligation; ci.yml is carried anyway, to build,
  # type-check and scan the site before it reaches Cloudflare.

# TEST-001/002/003/004 covered by static-site type scoping.
# XSTACK-001 covered by static-site type scoping (no server-side logic).
# XSTACK-003 (pnpm) covered by static-site type scoping (npm permitted for static sites).
# CD-002/009/010 covered by static-site type scoping (no server runtime).
