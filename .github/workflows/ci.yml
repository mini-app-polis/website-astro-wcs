name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, `npm audit` against the resolved dependency set, and
  # semgrep. sbom: false because SEC-005 does not apply to a static-site.
  #
  # `release` deliberately does NOT depend on this job. The audit cannot
  # pass until astro 4 -> 7 and @astrojs/cloudflare 11 -> 14 are done,
  # and gating the site's releases on an unscoped major migration would
  # freeze deploys rather than fix anything. The job reports; it does not
  # block. Add `security` to release's `needs` once the audit is green.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v1
    with:
      language: typescript
      package-manager: npm
      sbom: false

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          KAIANO_API_BASE_URL: ${{ vars.KAIANO_API_BASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/npm \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
