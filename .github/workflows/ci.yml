name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, `npm audit` against the resolved dependency set, and
  # semgrep. sbom: false because SEC-005 does not apply to a static-site.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: typescript
      package-manager: npm
      sbom: false

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # A floating "22" takes the runner's cached 22.x, which can be
          # older than the minimum the site's Astro version requires.
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # The build stops without these. CI only proves the site builds and
          # type-checks, so it points at the development API and uses
          # Cloudflare's test site key, which passes every challenge. Pages
          # builds carry the real values, set by infra.
          PUBLIC_API_URL: https://dev-api.kaianolevine.com
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          # Consumed at build time through import.meta.env and baked into the
          # client bundle. Without it the build succeeds and ships a site where
          # Clerk never initialises, so nobody can sign in.
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}

  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3

  # Conformance is graded on every change once CI passes, before it is
  # released (CD-031), so a docs or chore commit that cuts no release is
  # graded too. Nothing waits for the answer: the job reports whether the
  # request landed, never what was found.
  evaluate:
    needs: [test, security]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    with:
      ref: dev
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
